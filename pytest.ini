[pytest]
# scripts/ holds the importable modules; tests import them by bare name.
pythonpath = scripts
testpaths = tests
# Default run is the offline suite. Live (browser + real bazos) tests are opt-in:
#   pytest -m live      (requires a verified session; harness-guarded, read-only)
addopts = -m "not live"
markers =
    live: test drives the live bazos.cz site via Playwright (read-only, all writes intercepted); requires a verified session + chromium.
